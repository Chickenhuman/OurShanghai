.panel-close,.mobile-schedule-btn,.mobile-backdrop{display:none}

<body>
<div class="app">
  <aside class="panel" id="schedulePanel" data-sheet="collapsed" aria-label="여행 일정">
    <button class="sheet-grabber" id="sheetGrabber" type="button" aria-label="일정 패널 높이 변경" aria-controls="schedulePanel"></button>
    <button class="panel-close" id="panelClose" type="button" aria-label="일정 패널 축소"></button>
    <nav class="dayfilter" id="dayfilter" aria-label="날짜 필터"></nav>
    <main class="timeline" id="timeline" aria-live="polite"></main>
  </aside>
  <section class="map-wrap" aria-label="여행 일정 지도">
    <div class="map-title"><b id="mapLabel">전체</b></div>
    <button class="plan-toggle" id="planToggle" type="button" aria-label="여행 플랜 전환" aria-pressed="false">Plan A</button>
    <div class="poi-control" id="poiControl">
      <button class="poi-menu-btn" id="poiMenuButton" type="button" aria-expanded="false" aria-controls="poiMenu">주변 장소 <span class="poi-count" id="poiCount">0</span></button>
      <div class="poi-menu" id="poiMenu" role="group" aria-label="주변 장소 레이어" hidden><h2>지도에 표시</h2><div id="poiToolbar"></div></div>
    </div>
    <div class="locate-control">
      <button class="locate-btn" id="locateBtn" type="button" aria-label="내 현재 위치 표시" aria-pressed="false" title="내 위치">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path><circle cx="12" cy="12" r="8"></circle></svg>
      </button>
    </div>
    <div id="map" tabindex="0"></div>
  </section>
</div>
<div class="mobile-backdrop" id="mobileBackdrop"></div>
<button class="mobile-schedule-btn" id="mobileScheduleBtn" type="button" aria-controls="schedulePanel" aria-expanded="false"><span>일정</span></button>
<div class="action-menu" id="actionMenu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const locateBtn=document.getElementById('locateBtn');
let locationWatchId=null,userLocationMarker=null,userAccuracyCircle=null,lastUserLocation=null,hasCenteredOnUser=false;
function userLocationIcon(){return L.divIcon({className:'',html:'<div class="user-location-dot" aria-hidden="true"></div>',iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-12]})}
function setLocateButtonState(state){
  locateBtn.classList.toggle('locating',state==='locating');
  locateBtn.classList.toggle('active',state==='active');
  locateBtn.setAttribute('aria-pressed',String(state==='active'));
  locateBtn.setAttribute('aria-label',state==='active'?'현재 위치로 이동':'내 현재 위치 표시');
  locateBtn.title=state==='active'?'현재 위치로 이동':'내 위치';
}
function updateUserLocation(position){
  const {latitude,longitude,accuracy}=position.coords,latlng=[latitude,longitude];
  lastUserLocation={lat:latitude,lng:longitude,accuracy};
  if(!userLocationMarker){
    userLocationMarker=L.marker(latlng,{icon:userLocationIcon(),zIndexOffset:1200,keyboard:false}).addTo(map);
    userAccuracyCircle=L.circle(latlng,{radius:Math.max(accuracy||0,5),color:'#2186d4',weight:1,opacity:.45,fillColor:'#2186d4',fillOpacity:.10,interactive:false}).addTo(map);
  }else{
    userLocationMarker.setLatLng(latlng);
    userAccuracyCircle.setLatLng(latlng).setRadius(Math.max(accuracy||0,5));
  }
  const accuracyText=Number.isFinite(accuracy)?`정확도 약 ${Math.round(accuracy)}m`:'GPS 위치';
  userLocationMarker.bindPopup(`<div class="pop-place">현재 위치</div><div class="pop-address">${accuracyText}</div>`);
  setLocateButtonState('active');
  if(!hasCenteredOnUser){map.setView(latlng,16,{animate:true});hasCenteredOnUser=true;showToast('현재 위치를 표시했습니다')}
}
function handleLocationError(error){
  setLocateButtonState('idle');
  const message=error.code===1?'위치 권한이 거부되었습니다. 브라우저 사이트 설정에서 위치 권한을 허용해주세요.':error.code===2?'현재 위치를 확인할 수 없습니다. GPS 또는 네트워크 상태를 확인해주세요.':error.code===3?'위치 확인 시간이 초과되었습니다. 다시 시도해주세요.':'현재 위치를 불러오지 못했습니다.';
  showToast(message);
  if(locationWatchId!==null){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null}
}
function startLocationTracking(){
  if(!window.isSecureContext){showToast('GPS 기능은 HTTPS 환경에서 사용할 수 있습니다.');return}
  if(!('geolocation' in navigator)){showToast('이 브라우저는 위치 기능을 지원하지 않습니다.');return}
  if(locationWatchId!==null)return;
  setLocateButtonState('locating');
  showToast('현재 위치를 확인하는 중입니다');
  locationWatchId=navigator.geolocation.watchPosition(updateUserLocation,handleLocationError,{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}
locateBtn.addEventListener('click',()=>{
  if(lastUserLocation){map.setView([lastUserLocation.lat,lastUserLocation.lng],16,{animate:true});userLocationMarker?.openPopup();return}
  startLocationTracking();
});
window.addEventListener('pagehide',()=>{if(locationWatchId!==null)navigator.geolocation.clearWatch(locationWatchId)});


function initPoiLayers(){Object.keys(POI_CATEGORIES).forEach(cat=>{poiLayerGroups[cat]=L.layerGroup()});POI_PLACES.forEach(poi=>{const marker=L.marker([poi.lat,poi.lon],{icon:makePoiIcon(poi.cat)}).bindPopup(poiPopupHtml(poi));marker._poiCategory=poi.cat;marker.addTo(poiLayerGroups[poi.cat]);poiMarkers.push(marker)})}
function syncPoiLayers(){
  Object.entries(poiLayerGroups).forEach(([cat,group])=>{if(poiToggleState[cat]){if(!map.hasLayer(group))group.addTo(map)}else if(map.hasLayer(group))map.removeLayer(group)});
  document.querySelectorAll('.poi-toggle[data-cat]').forEach(btn=>{const cat=btn.dataset.cat,active=!!poiToggleState[cat];btn.setAttribute('aria-pressed',String(active));btn.querySelector('.poi-toggle-state').textContent=active?'표시 중':'숨김'});
  const count=Object.values(poiToggleState).filter(Boolean).length, badge=document.getElementById('poiCount');badge.textContent=count;badge.classList.toggle('show',count>0)
}
function renderPoiToolbar(){
  const toolbar=document.getElementById('poiToolbar');toolbar.innerHTML='';
  [['massage','마사지/발'],['spa','스파'],['ear','귀청소'],['head','헤드스파']].forEach(([cat,label])=>{
    const btn=document.createElement('button');btn.type='button';btn.className='poi-toggle';btn.dataset.cat=cat;btn.style.setProperty('--poiColor',POI_CATEGORIES[cat].color);btn.setAttribute('aria-pressed','false');btn.innerHTML=`<span class="poi-toggle-left"><span class="poi-dot"></span>${label}</span><span class="poi-toggle-state">숨김</span>`;btn.addEventListener('click',()=>{poiToggleState[cat]=!poiToggleState[cat];syncPoiLayers()});toolbar.appendChild(btn)
  })
}

function markerBackground(colors){const c=[...new Set(colors)];if(c.length<=1)return c[0]||'#777';if(c.length===2)return `linear-gradient(135deg,${c[0]} 0 49%,${c[1]} 51% 100%)`;return `conic-gradient(${c[0]} 0 33%,${c[1]} 33% 66%,${c[2]} 66% 100%)`}
function buildStableRouteNumbers(){const result=new Map();let seq=1;plans[plan].forEach(d=>d.events.forEach(ev=>{if(!ev.place||!places[ev.place])return;result.set(eventKey(d.date,ev.time,ev.title),seq++)}));return result}
function icon(firstNo,colors,count){const badge=count>1?`<span class="multi-badge">${count}</span>`:'';return L.divIcon({className:'',html:`<div class="num-marker" style="background:${markerBackground(colors)}">${firstNo}${badge}</div>`,iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-17]})}
function popupHtml(group){const visits=group.visits.map(v=>`<div class="pop-visit" data-route-no="${v.routeNo}" style="--visitColor:${v.day.color}"><div class="pop-time">#${v.routeNo} · ${v.day.date} · ${v.ev.time}</div><div class="pop-title">${v.ev.title}</div>${v.ev.note?`<div class="pop-note">${v.ev.note}</div>`:''}</div>`).join('');return `<div class="pop-place">${group.place.name}</div><div class="pop-address">${group.place.note||''}</div>${visits}`}
function setActiveEvent(key){activeEventKey=key;document.querySelectorAll('.event').forEach(el=>el.classList.toggle('active-event',el.dataset.key===key))}
function nextTravelVisit(visit){if(!visit)return null;let next=visit.next;while(next&&next.p.lat===visit.p.lat&&next.p.lon===visit.p.lon)next=next.next;return next}
function highlightNextRoute(key){clearRouteHighlight();const visit=routeLookup.get(key),next=nextTravelVisit(visit);if(!visit||!next)return;const coords=[[visit.p.lat,visit.p.lon],[next.p.lat,next.p.lon]];const halo=L.polyline(coords,{color:'#fff',weight:11,opacity:.92,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);const line=L.polyline(coords,{color:'#ff8a1f',weight:7,opacity:1,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);activeRouteLayers.push(halo,line);halo.bringToFront();line.bringToFront()}
function activateRouteNo(routeNo,scroll=true){const visit=routeNoLookup.get(routeNo);if(!visit)return;setActiveEvent(visit.key);highlightNextRoute(visit.key);if(scroll){const el=[...document.querySelectorAll('.event')].find(x=>x.dataset.key===visit.key);el?.scrollIntoView({behavior:'smooth',block:'center'})}}
function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function scrollToEvent(date,time,title){const key=eventKey(date,time,title);setActiveEvent(key);highlightNextRoute(key);const el=[...document.querySelectorAll('.event')].find(x=>x.dataset.key===key);el?.scrollIntoView({behavior:'smooth',block:'center'})}
function findPlaceMarker(placeKey){return layers.find(l=>l instanceof L.Marker&&l._placeKey===placeKey)}

function draw(){
  clearLayers();routeLookup=new Map();routeNoLookup=new Map();let bounds=[];const stableRouteNumbers=buildStableRouteNumbers(),groups=new Map(),lineLayers=[];
  visibleDays().forEach(d=>{const dayVisits=[];d.events.forEach(ev=>{if(!ev.place)return;const p=places[ev.place];if(!p)return;const key=eventKey(d.date,ev.time,ev.title),routeNo=stableRouteNumbers.get(key);bounds.push([p.lat,p.lon]);const visit={day:d,ev,p,routeNo,key,next:null};dayVisits.push(visit);if(!groups.has(ev.place))groups.set(ev.place,{placeKey:ev.place,place:p,visits:[]});groups.get(ev.place).visits.push(visit)});dayVisits.forEach((visit,i)=>{visit.next=dayVisits[i+1]||null;routeLookup.set(visit.key,visit);routeNoLookup.set(visit.routeNo,visit)});const pts=dayVisits.map(v=>[v.p.lat,v.p.lon]);if(pts.length>1)lineLayers.push(L.polyline(pts,{color:d.color,weight:3,opacity:.48,dashArray:'7 7'}))});
  lineLayers.forEach(line=>{line.addTo(map);layers.push(line)});
  groups.forEach(group=>{const first=group.visits[0],colors=group.visits.map(v=>v.day.color);const marker=L.marker([group.place.lat,group.place.lon],{icon:icon(first.routeNo,colors,group.visits.length)}).addTo(map);marker._placeKey=group.placeKey;marker.bindPopup(popupHtml(group));marker.on('click',()=>scrollToEvent(first.day.date,first.ev.time,first.ev.title));marker.on('popupopen',()=>{const node=marker.getPopup().getElement();node?.querySelectorAll('.pop-visit[data-route-no]').forEach(el=>el.addEventListener('click',()=>activateRouteNo(Number(el.dataset.routeNo),true)))});layers.push(marker)});
  if(bounds.length)map.fitBounds(bounds,{padding:[42,42],maxZoom:14});if(activeEventKey)highlightNextRoute(activeEventKey);document.getElementById('mapLabel').textContent=day==='all'?'전체':plans[plan][Number(day)].date
}

function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function focusEvent(d,ev,p){const key=eventKey(d.date,ev.time,ev.title);setActiveEvent(key);highlightNextRoute(key);if(isMobile())setSheetState('collapsed');if(p){map.flyTo([p.lat,p.lon],15,{duration:.65});setTimeout(()=>findPlaceMarker(ev.place)?.openPopup(),650)}else{clearRouteHighlight();showToast(ev.note||'위치 정보 없음')}}
function setOptionChoice(d,ev){const key=optionKey(d.date,ev.time);chosenOptions[key]=eventKey(d.date,ev.time,ev.title);storage.set('tripChosenOptions',chosenOptions);renderTimeline()}
function toggleCompleted(key){if(completedEvents.has(key))completedEvents.delete(key);else completedEvents.add(key);storage.set('tripCompletedEvents',[...completedEvents]);renderTimeline();closeActionMenu()}

function createEventRow(d,ev,{inOptionGroup=false}={}){
  const p=ev.place?places[ev.place]:null,key=eventKey(d.date,ev.time,ev.title),row=document.createElement('div');row.className='event'+(p?'':' no-map')+(activeEventKey===key?' active-event':'')+(completedEvents.has(key)?' completed':'');row.dataset.key=key;row.style.setProperty('--eventColor',d.color);
  if(inOptionGroup&&chosenOptions[optionKey(d.date,ev.time)]===key)row.classList.add('option-selected');
  const detail=[p?.name,ev.note].filter(Boolean).filter((v,idx,a)=>a.indexOf(v)===idx).join(' · '),selected=inOptionGroup&&chosenOptions[optionKey(d.date,ev.time)]===key;
  const main=document.createElement('button');main.type='button';main.className='event-main';main.setAttribute('aria-label',[ev.time,ev.title,p?.name,ev.optional?'선택 일정':'',selected?'선택됨':''].filter(Boolean).join(', '));main.innerHTML=`<span class="time">${escapeHtml(ev.time)}</span><span class="dot" style="background:${p?d.color:'transparent'}"></span><span class="copy"><b>${escapeHtml(ev.title)}${ev.optional?'<span class="tag">선택</span>':''}${selected?'<span class="option-check">선택됨</span>':''}</b><small>${escapeHtml(detail)}</small></span>`;
  main.addEventListener('click',()=>{if(inOptionGroup)setOptionChoice(d,ev);focusEvent(d,ev,p)});row.appendChild(main);
  const more=document.createElement('button');more.type='button';more.className='event-actions-btn';more.textContent='⋯';more.setAttribute('aria-label',`${ev.title} 추가 작업`);more.setAttribute('aria-haspopup','menu');more.setAttribute('aria-expanded','false');more.addEventListener('click',e=>{e.stopPropagation();openActionMenu(more,d,ev,p,key)});row.appendChild(more);return row
}
function renderTimeline(){
  const root=document.getElementById('timeline');root.innerHTML='';plans[plan].forEach((d,i)=>{if(day!=='all'&&day!==String(i))return;const sec=document.createElement('section');sec.className='day';sec.setAttribute('aria-labelledby',`day-${plan}-${i}`);sec.innerHTML=`<div class="day-title"><strong id="day-${plan}-${i}">${d.date}</strong><span>${d.events.length}개 일정</span></div>`;
    for(let idx=0;idx<d.events.length;idx++){const ev=d.events[idx];if(ev.optional){const grouped=[ev];let j=idx+1;while(j<d.events.length&&d.events[j].optional&&d.events[j].time===ev.time){grouped.push(d.events[j]);j++}if(grouped.length>1){const wrap=document.createElement('div');wrap.className='option-group';const chosen=chosenOptions[optionKey(d.date,ev.time)];wrap.innerHTML=`<div class="option-head"><strong>${escapeHtml(ev.time)} 선택 일정</strong><span>${chosen?'1개 선택됨':'하나를 선택하세요'}</span></div>`;grouped.forEach(item=>wrap.appendChild(createEventRow(d,item,{inOptionGroup:true})));sec.appendChild(wrap);idx=j-1;continue}}sec.appendChild(createEventRow(d,ev))}root.appendChild(sec)
  })
}
function renderFilters(){const box=document.getElementById('dayfilter');box.innerHTML='';const opts=[{v:'all',t:'전체',color:'#202933'},...plans[plan].map((d,i)=>({v:String(i),t:d.date,color:d.color}))];opts.forEach(o=>{const b=document.createElement('button');b.type='button';b.className=day===o.v?'active':'';b.style.setProperty('--dayColor',o.color);b.setAttribute('aria-pressed',String(day===o.v));b.innerHTML=o.v==='all'?o.t:`<span class="filter-dot" aria-hidden="true"></span>${o.t}`;b.onclick=()=>{day=o.v;activeEventKey='';renderFilters();renderTimeline();draw()};box.appendChild(b)})}
function setPlan(p){plan=p;day='all';activeEventKey='';const toggle=document.getElementById('planToggle');toggle.textContent=`Plan ${p}`;toggle.dataset.plan=p;toggle.setAttribute('aria-label',`현재 Plan ${p}. 눌러서 Plan ${p==='A'?'B':'A'}로 전환`);toggle.setAttribute('aria-pressed',String(p==='B'));document.documentElement.style.setProperty('--accent',p==='A'?'#d7482f':'#2b6f9f');renderFilters();renderTimeline();draw()}

const actionMenu=document.getElementById('actionMenu');let activeActionButton=null;
function closeActionMenu(){actionMenu.hidden=true;if(activeActionButton)activeActionButton.setAttribute('aria-expanded','false');activeActionButton=null}
function openActionMenu(button,d,ev,p,key){closeActionMenu();activeActionButton=button;button.setAttribute('aria-expanded','true');const actions=[];if(p){actions.push(['지도에서 보기',()=>focusEvent(d,ev,p)]);actions.push(['주소 복사',async()=>{const text=p.note||p.name;let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);copied=true}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();copied=document.execCommand('copy');ta.remove()}}catch{}showToast(copied?'주소를 복사했습니다':text);closeActionMenu()}]);actions.push(['고덕지도에서 검색',()=>{const q=encodeURIComponent(`${p.name} ${p.note||''}`);window.open(`https://uri.amap.com/search?keyword=${q}&src=tripmap&callnative=0`,'_blank','noopener');closeActionMenu()}])}actions.push([completedEvents.has(key)?'완료 표시 해제':'완료로 표시',()=>toggleCompleted(key)]);actionMenu.innerHTML='';actions.forEach(([label,handler])=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.textContent=label;b.addEventListener('click',handler);actionMenu.appendChild(b)});const rect=button.getBoundingClientRect(),w=188,left=Math.min(window.innerWidth-w-10,Math.max(10,rect.right-w)),top=Math.min(window.innerHeight-220,rect.bottom+6);actionMenu.style.left=`${left}px`;actionMenu.style.top=`${Math.max(10,top)}px`;actionMenu.hidden=false;actionMenu.querySelector('button')?.focus()}

document.addEventListener('click',e=>{if(!actionMenu.hidden&&!actionMenu.contains(e.target)&&!e.target.closest('.event-actions-btn'))closeActionMenu()});

const schedulePanel=document.getElementById('schedulePanel'),sheetGrabber=document.getElementById('sheetGrabber'),panelClose=document.getElementById('panelClose'),mobileBackdrop=document.getElementById('mobileBackdrop'),mobileScheduleBtn=document.getElementById('mobileScheduleBtn');
function isMobile(){return window.matchMedia('(max-width:840px)').matches}
function setSheetState(state){if(!isMobile())return;schedulePanel.dataset.sheet=state;const full=state==='full';mobileBackdrop.classList.toggle('show',full);document.body.classList.toggle('schedule-open',state!=='collapsed');panelClose.setAttribute('aria-label',full?'일정 패널 닫기':'일정 패널 축소');setTimeout(()=>map.invalidateSize(),120)}
function cycleSheet(){const s=schedulePanel.dataset.sheet||'collapsed';setSheetState(s==='collapsed'?'mid':s==='mid'?'full':'collapsed')}
sheetGrabber.addEventListener('click',cycleSheet);panelClose.addEventListener('click',()=>setSheetState(schedulePanel.dataset.sheet==='full'?'collapsed':'collapsed'));mobileBackdrop.addEventListener('click',()=>setSheetState('collapsed'));mobileScheduleBtn.addEventListener('click',()=>setSheetState('mid'));
let dragStartY=0,dragStartTranslate=0,dragging=false;
function currentTranslate(){const style=getComputedStyle(schedulePanel);const m=new DOMMatrixReadOnly(style.transform);return m.m42||0}
sheetGrabber.addEventListener('pointerdown',e=>{if(!isMobile())return;dragging=true;dragStartY=e.clientY;dragStartTranslate=currentTranslate();sheetGrabber.setPointerCapture(e.pointerId);schedulePanel.style.transition='none'});
sheetGrabber.addEventListener('pointermove',e=>{if(!dragging)return;const max=schedulePanel.offsetHeight-118,dy=e.clientY-dragStartY,next=Math.max(0,Math.min(max,dragStartTranslate+dy));schedulePanel.style.transform=`translateY(${next}px)`});
function endDrag(e){if(!dragging)return;dragging=false;schedulePanel.releasePointerCapture?.(e.pointerId);const translate=currentTranslate(),h=schedulePanel.offsetHeight;schedulePanel.style.transition='';schedulePanel.style.transform='';const ratio=translate/h;setSheetState(ratio<.23?'full':ratio<.68?'mid':'collapsed')}
sheetGrabber.addEventListener('pointerup',endDrag);sheetGrabber.addEventListener('pointercancel',endDrag);

const poiMenuButton=document.getElementById('poiMenuButton'),poiMenu=document.getElementById('poiMenu');poiMenuButton.addEventListener('click',()=>{const open=poiMenu.hidden;poiMenu.hidden=!open;poiMenuButton.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!document.getElementById('poiControl').contains(e.target)){poiMenu.hidden=true;poiMenuButton.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeActionMenu();poiMenu.hidden=true;poiMenuButton.setAttribute('aria-expanded','false');if(isMobile()&&schedulePanel.dataset.sheet==='full')setSheetState('mid')}});
document.getElementById('planToggle').addEventListener('click',()=>setPlan(plan==='A'?'B':'A'));

document.getElementById('planToggle').dataset.plan=plan;initPoiLayers();renderPoiToolbar();syncPoiLayers();renderFilters();renderTimeline();draw();
window.addEventListener('resize',()=>{if(!isMobile()){schedulePanel.style.transform='';schedulePanel.dataset.sheet='collapsed';mobileBackdrop.classList.remove('show')}setTimeout(()=>map.invalidateSize(),120)});
</script>
